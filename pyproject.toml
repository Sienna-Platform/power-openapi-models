[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-openapi-models"
version = "0.1.0"
description = "Auto-generated Python models from Power System JSON Schemas"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "datamodel-code-generator",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# E741 (ambiguous variable name): the generated models are field-for-field with
# SiennaSchemas' power-system quantities, which use standard electrical-engineering
# single-letter names (e.g. `l` for inductance) -- not something to rename away from.
ignore = ["E741"]

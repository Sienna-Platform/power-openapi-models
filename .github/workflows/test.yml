name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - id: schema-version
        run: |
          short_sha=$(cat .schema-version)
          response=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/Sienna-Platform/SiennaSchemas/commits/${short_sha}" || true)
          full_sha=""
          if [ -n "$response" ]; then
            full_sha=$(printf '%s' "$response" | python3 -c "import json, sys; print(json.load(sys.stdin).get('sha', ''))")
          fi
          if [ -z "$full_sha" ]; then
            echo "::error::Could not resolve full sha for SiennaSchemas commit '${short_sha}' (from .schema-version) via the GitHub API" >&2
            exit 1
          fi
          echo "sha=$full_sha" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/SiennaSchemas
          ref: ${{ steps.schema-version.outputs.sha }}
          path: SiennaSchemas
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/ -q
        env:
          SIENNA_SCHEMAS_DIR: ${{ github.workspace }}/SiennaSchemas
      # Makes the py.typed marker honest. A marker over an incomplete
      # annotation surface tells every downstream type checker something
      # false. scripts/check_typecompleteness.py runs pyright --verifytypes
      # itself (with PYTHONPATH=src -- an editable install alone does not
      # let --verifytypes find a src/-layout package) and enforces a
      # completeness floor explicitly: pyright's raw exit code reflects
      # whether it printed any diagnostic, not whether the score cleared a
      # bar, so it is not on its own an honest gate.
      - run: python3 scripts/check_typecompleteness.py
      - run: python3 -m build
      - run: python3 -m twine check dist/*
